};

const memories = [
  ["“Avan kedakuran.”","The manager apparently wasn't going to stop the talking.","A tiny work-hours rebellion in the name of talking to Bee."],
  ["Jackson Wang","Celebrity-crush jealousy was apparently a serious matter.","Jackson Wang was not allowed to have an easy time in this universe."],
  ["The pet policy","You didn’t want a cat or dog stealing all my future attention.","Future pets would have to negotiate for attention."],
  ["Diminishing marginal utility","Even flirting could turn into an economics lesson.","Romance, but make it an economics lecture."],
  ["The Green Lantern reference","A story about asking someone to marry you after only two days because you already knew, but didn’t want to startle her.","He fell for her immediately, waited so he wouldn’t startle her, and asked after two days."],
  ["The perfect crime","“If I stole your heart & you stole mine, wouldn’t that be a perfect crime?”","A meme that made stealing a heart sound like a flawless heist."],
  ["The tiger thought","“Handling a tiger is easier than thinking about handling a tiger.” And then you became Buddha.","The tiger line that made the overthinker sound like a monk."],
  ["The Delhi house","You showed me your Delhi house and asked if it was normal to be jealous of your dad.","A house photo, a little jealousy, and an unexpectedly sweet question."]
];

let current="home", target=null, travelTimer=null;
const visited=new Set(), popupCycle={};
const app=document.getElementById("app");

function btn(text,action,cls="btn"){return `<button type="button" class="${cls}" data-action="${action}">${text}</button>`}
function getPage(id){return pages.find(p=>p.id===id)}
function chapterNo(id){return pages.filter(p=>p.id!=="home").findIndex(p=>p.id===id)+1}
function progress(){return `<div class="progress"><span style="width:${Math.max(0,chapterNo(current))/9*100}%"></span></div>`}
function heading(p){return `<div class="chapter-head"><div class="chapter-icon">${p.icon}</div><div><div class="eyebrow">${p.eyebrow}</div><h2>${p.title}</h2></div></div>`}

function navRow(){
  const i=pages.findIndex(p=>p.id===current);
  const prev=i>1?pages[i-1]:null, next=i<pages.length-1?pages[i+1]:null;
  return `<div class="nav-row">
    ${prev?btn("← Previous orbit","back","btn ghost"):btn("← Galaxy","map","btn ghost")}
    <span class="page-count">ORBIT ${String(Math.max(1,chapterNo(current))).padStart(2,"0")} / 09</span>
    ${next?btn("Next orbit →","next","btn primary"):btn("Galaxy map ✦","map","btn primary")}
  </div>`;
}

function renderHome(){
  app.innerHTML=`<section class="scene hero">
    <div class="cosmos" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="core"></div><div class="moon"></div></div>
    <div class="eyebrow">A TIME CAPSULE · 11 OCTOBER 2025</div>
    <h1>Somewhere in this universe,<br><em>Batman met Bee.</em></h1>
    <p>One hello on Schmooze. A hundred little things that followed. This is a tiny galaxy made just for the beginning of our story.</p>
    <div class="actions">${btn("Enter our galaxy ✦","map","btn primary")}</div>
    <p style="font-size:.78rem;color:#928caf;margin-top:18px">Nine planets. A suspicious bat. One very important bee.</p>
  </section>`;
}

function renderMap(){
  const list=pages.filter(p=>p.id!=="home");
  app.innerHTML=`<section class="scene panel">
    <div class="eyebrow">GALACTIC NAVIGATION SYSTEM</div><h2>Our little galaxy.</h2>
    <p>Choose a planet. Read the warning. Travel through space. Then tap the planet when you arrive to unlock its memory.</p>
    <div class="planet-map">${list.map((p,i)=>`<button type="button" class="planet-link" data-destination="${p.id}">
      <span class="planet p${i+1}"></span><span class="planet-name">${p.label}</span>
      <span class="planet-caption">${String(i+1).padStart(2,"0")} · ${visited.has(p.id)?"VISITED":"UNEXPLORED"}</span>
    </button>`).join("")}</div>
    ${btn("Launch from the beginning →","start","btn primary")}
    <div class="secret-note">P.S. A tiny star is hiding in the corner. Obviously, do not tap it.</div>
    <div class="actions">${btn("🦇 Tap the suspicious bat","bat","btn ghost")}${btn("🎲 Request a random transmission","random","btn ghost")}</div>
  </section>`;
}

function renderTravel(){
  clearTimeout(travelTimer);
  const p=getPage(target);
  if(!p){go("map");return}
  app.innerHTML=`<section class="scene travel-scene">
    ${Array.from({length:22},(_,i)=>`<span class="warp-star" style="left:${(i*37+7)%100}%;top:${(i*53+11)%100}%;animation-delay:${(i%7)*-.22}s;animation-duration:${1.1+(i%5)*.2}s"></span>`).join("")}
    <div class="eyebrow">INTERGALACTIC TRANSIT IN PROGRESS</div>
    <h2 style="margin-bottom:5px">Plotting course...</h2>
    <p style="max-width:450px">Please keep your arms, legs, and unresolved feelings inside the spacecraft until arrival.</p>
    <div class="travel-planet"></div><div class="eyebrow">DESTINATION LOCKED</div>
    <h3 style="font-size:1.7rem;color:var(--gold)">${p.label}</h3><p>Arriving at Orbit ${String(chapterNo(p.id)).padStart(2,"0")}...</p>
    ${btn("Skip the warp ✦","arrive","btn primary")}
  </section>`;
  travelTimer=setTimeout(renderArrival,1900);
}

function renderArrival(){
  clearTimeout(travelTimer);
  const p=getPage(target);
  if(!p){go("map");return}
  app.innerHTML=`<section class="scene travel-scene">
    <div class="eyebrow">ARRIVAL CONFIRMED · ORBIT ${String(chapterNo(p.id)).padStart(2,"0")}</div>
    <h2 style="margin-bottom:0">You made it.</h2><p>The planet has been located. Its lore is still classified.</p>
    <button type="button" class="arrival-button" data-open-arrival="${p.id}" aria-label="Open ${p.label}">
      <span class="planet p${chapterNo(p.id)}"></span><span style="font:1.7rem Georgia,serif">${p.icon} ${p.label}</span>
      <span class="arrival-hint">✦ TAP THE PLANET TO ENTER ✦</span>
    </button>
    <p style="font-size:.82rem;color:#a8a0c9">No tapping the planet means no lore. The galaxy has rules.</p>
    <div class="actions">${btn("Return to galaxy map","map","btn ghost")}${btn("Enter planet","open-arrival","btn primary")}</div>
  </section>`;
}

function renderStory(p){
  const batmanClause=p.id==="batman"?`<div class="panel" style="padding:18px;margin-top:20px;background:#17132b">
    <div class="eyebrow">🦇 THE 2 AM HUSBAND CLAUSE</div>
    <p>So, somewhere in a conversation about his dream of becoming a therapist after turning 50, I apparently had to attend a surprise compatibility interview.</p>
    <p>I asked him to pursue the dream he'd talked about.</p><p>And then came the question:</p>
    <div class="quote">‘Is it okay for you if your husband comes home by 2 AM every day?’</div>
    <p><strong>SIR. 😭</strong></p>
    <p>We were discussing your career dream. How did I end up negotiating the working hours of my hypothetical future husband?</p>
    <p>But underneath the ridiculousness was something rather sweet: we were imagining a future where he actually became that therapist, and I was being asked whether I could picture a life with him and the realities of that dream.</p>
    <p><strong>Batman: planning his post-50 career.<br>Me: apparently already in the wife interview round.</strong></p>
    <p>No HR department could have prepared me for this.</p>
  </div>`:"";
  app.innerHTML=`<section class="scene">${progress()}<div class="panel">
    ${heading(p)}
    <div class="split"><div>${(p.body||[]).map(t=>`<p>${t}</p>`).join("")}${batmanClause}</div>
      <div><div class="quote">${p.quote||""}</div><span class="stamp">${p.tag||""}</span>
      <div class="stars-line">✦ · ˚ ✧ ˚ · ✦</div>${btn("🦇 Tap the bat","bat","btn ghost")}${btn("✨ Surprise me","chapter-surprise","btn ghost")}</div>
    </div>${navRow()}
  </div></section>`;
}

function renderQuiz(p){
  renderStory(p);
  const right=`<div class="panel" id="quizPanel" style="margin-top:22px">
    <div class="eyebrow">THE INTERGALACTIC BEE INSTITUTE</div><h3>Apple-Bee science pop quiz</h3>
    <p>What was Batman trying to say with the Apple-Bee theory?</p>
    <div class="answer-list">
      <button class="answer" data-answer="wrong">Bees should stop visiting flowers.</button>
      <button class="answer" data-answer="correct">Sweetness can come from more than one place.</button>
      <button class="answer" data-answer="wrong">Apple is scientifically better than honey.</button>
    </div><div class="feedback" id="feedback"></div>
  </div>`;
  const panel=app.querySelector(".panel");
  panel.insertAdjacentHTML("beforeend",right);
}
function renderMemories(p){
  renderStory(p);
  const html=`<div class="memory-grid">${memories.map((m,i)=>`<button type="button" class="memory" data-memory="${i}"><b>${m[0]}</b><span>${m[1]}</span></button>`).join("")}</div><div class="feedback" id="memoryFeedback" style="margin-top:18px">Every card is a small orbit of its own. ✦</div>`;
  app.querySelector(".split").insertAdjacentHTML("afterend",html);
}
function renderEnd(p){
  app.innerHTML=`<section class="scene"><div class="panel" style="text-align:center">
    <div class="cosmos" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="core"></div><div class="moon"></div></div>
    <div class="eyebrow">${p.eyebrow}</div><h2>${p.title}</h2>
    ${p.body.map(t=>`<p style="max-width:660px;margin:0 auto 15px">${t}</p>`).join("")}
    <div class="final-orbit"><span>🦇</span><i></i><span>🐝</span></div>
    <div class="quote">${p.quote}</div><span class="stamp">${p.tag}</span>
    <div class="actions">${btn("Back to the galaxy ✦","map","btn primary")}${btn("Read from the start","start","btn")}</div>
  </div></section>`;
}
function render(){
  if(current==="home")return renderHome();
  if(current==="map")return renderMap();
  if(current==="travel")return renderTravel();
  const p=getPage(current);
  if(!p){current="home";return renderHome()}
  if(current==="applebee")renderQuiz(p);
  else if(current==="memories")renderMemories(p);
  else if(current==="end")renderEnd(p);
  else renderStory(p);
  window.scrollTo({top:0,behavior:"smooth"});
}

function showModal(icon,title,message){
  document.getElementById("chapterModal")?.remove();
  const box=document.createElement("div");
  box.className="modal-backdrop";box.id="chapterModal";
  box.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="modal-icon">${icon}</span><div class="eyebrow">GALACTIC ADVISORY NOTICE</div>
    <h3 id="modalTitle">${title}</h3><p>${message}</p>
    <button type="button" class="btn primary" data-dismiss-modal>Understood, captain ✦</button>
  </div>`;
  document.body.appendChild(box);
  box.addEventListener("click",e=>{if(e.target===box||e.target.closest("[data-dismiss-modal]"))box.remove()});
}
function showPopup(id,random=false){
  const list=popups[id];if(!list?.length)return;
  let index=popupCycle[id]||0;
  if(random)index=Math.floor(Math.random()*list.length);
  popupCycle[id]=(index+1)%list.length;
  const [icon,title,message]=list[index];showModal(icon,title,message);
}
function showBat(){showModal("🦇","Batman is busy","Batman is busy drafting another policy. Please try again after seven kisses.")}
function startTravel(id){target=id;current="travel";render()}
function openArrival(){
  if(!target)return;
  current=target;visited.add(current);render();showPopup(current);
}
function go(id){
  document.getElementById("chapterModal")?.remove();
  clearTimeout(travelTimer);
  if(id==="start")id="origin";
  if(id==="next"){
    const i=pages.findIndex(p=>p.id===current),next=pages[i+1];
    if(next&&next.id!=="home"){startTravel(next.id);return}
    id="map";
  }
  if(id==="back"){
    const i=pages.findIndex(p=>p.id===current);
    id=i>1?pages[i-1].id:"map";
  }
  if(id==="map"){current="map";render();return}
  if(getPage(id)){current=id;visited.add(id);render()}
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.destination){startTravel(b.dataset.destination);return}
  if(b.dataset.openArrival){openArrival();return}
  if(b.dataset.action){
    const a=b.dataset.action;
    if(a==="map"){go("map");return}
    if(a==="start"){go("start");return}
    if(a==="next"||a==="back"){go(a);return}
    if(a==="arrive"){renderArrival();return}
    if(a==="open-arrival"){openArrival();return}
    if(a==="bat"){showBat();return}
    if(a==="random"){
      const ids=Object.keys(popups),id=ids[Math.floor(Math.random()*ids.length)];
      showPopup(id,true);return;
    }
    if(a==="chapter-surprise"){showPopup(current,true);return}
  }
  if(b.dataset.answer){
    const answers=app.querySelectorAll("[data-answer]"),feedback=app.querySelector("#feedback");
    if(b.dataset.answer==="correct"){
      answers.forEach(x=>{x.disabled=true;if(x.dataset.answer==="correct")x.classList.add("correct")});
      feedback.textContent="Correct answer! Your certificate is imaginary, but your confidence is real.";
      showModal("🎓","Degree awarded","Correct! Your certificate is imaginary, but your confidence is real.");
    }else{
      b.classList.add("wrong");b.disabled=true;
      feedback.textContent="Incorrect answer. Please return to your home planet and reconsider your life choices.";
    }
    return;
  }
  if(b.dataset.memory!==undefined){
    const m=memories[Number(b.dataset.memory)];
    const feedback=app.querySelector("#memoryFeedback");
    if(feedback)feedback.textContent=m[2];
    showModal("✨","Memory unlocked",m[2]);
  }
});

document.getElementById("batButton").addEventListener("click",showBat);
document.getElementById("secretStar").addEventListener("click",()=>{
  showModal("🏆","Achievement unlocked","You have discovered classified Batman lore. Your clearance level is now ‘suspiciously invested.’");
});
render();
</script>
</body>
</html>
