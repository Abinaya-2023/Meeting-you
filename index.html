
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090719">
<title>Batman × Bee | The Lore</title>
<style>
:root{
  --bg:#090719;--text:#f8f2ff;--muted:#c7bfdf;
  --gold:#ffe3a3;--pink:#ffbce2;--purple:#cbb3ff;
  --blue:#a8eaff;--line:#bda9ff42;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 10% 15%,#57338166,transparent 35%),
    radial-gradient(ellipse at 90% 40%,#14516a55,transparent 35%),
    radial-gradient(ellipse at 50% 100%,#5d265444,transparent 40%),var(--bg);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
}
body:before{
  background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 100px,#fff,transparent),
    radial-gradient(2px 2px at 180px 80px,#d9c5ff,transparent),
    radial-gradient(1px 1px at 250px 170px,#fff,transparent);
  background-size:280px 220px;
  animation:twinkle 5s ease-in-out infinite alternate;
}
body:after{
  background-image:
    radial-gradient(1px 1px at 60px 60px,#fff,transparent),
    radial-gradient(1px 1px at 210px 120px,#b8e9ff,transparent);
  background-size:310px 250px;
  animation:starDrift 32s linear infinite;
}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(-250px)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -12px}}
@keyframes drift{0%,100%{margin-left:-5px}50%{margin-left:7px}}
@keyframes pulseGlow{0%,100%{filter:brightness(1);box-shadow:0 0 22px #b7a2ff35}50%{filter:brightness(1.17);box-shadow:0 0 38px #b7a2ff75}}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes travel{
  0%{opacity:1;transform:scale(1) rotate(0)}
  45%{opacity:.6;transform:scale(.72) rotate(3deg)}
  100%{opacity:0;transform:scale(1.45) rotate(-2deg)}
}
@keyframes flyPlanet{
  0%{transform:translate(0,0) scale(.65);opacity:.35}
  55%{transform:translate(-25px,-10px) scale(1.12);opacity:1}
  100%{transform:translate(0,0) scale(1);opacity:1}
}
@keyframes streak{
  from{transform:translateX(110vw);opacity:0}
  20%{opacity:.8}
  to{transform:translateX(-120vw);opacity:0}
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
header{
  max-width:1050px;margin:auto;padding:22px;
  display:flex;justify-content:space-between;align-items:center;
  color:var(--muted);font-size:.75rem;letter-spacing:.13em;
}
header strong{color:var(--gold)}
main{width:min(940px,calc(100% - 28px));margin:auto;min-height:80vh;padding:16px 0 45px}
.scene{animation:enter .4s ease both}
.hero{text-align:center;padding:30px 0}
.eyebrow{color:var(--blue);font-size:.7rem;letter-spacing:.18em;font-weight:750;text-transform:uppercase}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400}
h1{font-size:clamp(2.7rem,8vw,5.5rem);line-height:1.03;letter-spacing:-.04em;margin:22px 0}
h2{font-size:clamp(2.1rem,5vw,3.5rem);line-height:1.08;margin:12px 0 22px}
h3{font-size:1.45rem}
p{line-height:1.85;color:#dcd5ee}
em{font-style:normal;color:var(--gold)}
.hero p{max-width:620px;margin:0 auto 24px}
.cosmos{
  width:165px;height:165px;position:relative;display:grid;place-items:center;
  margin:0 auto 27px;animation:float 5s ease-in-out infinite,drift 9s ease-in-out infinite;
}
.core{
  width:94px;height:94px;border-radius:50%;
  background:radial-gradient(circle at 28% 25%,white,#d9c6ff 13%,#8e67db 38%,#29204f 78%);
  box-shadow:0 0 45px #9e7aff88,0 0 95px #7754d444;
  animation:pulseGlow 5s ease-in-out infinite;
}
.orbit{position:absolute;width:165px;height:62px;border:1px solid #dfd0ff99;border-radius:50%;transform:rotate(-30deg)}
.orbit.two{width:145px;height:98px;transform:rotate(45deg);border-color:#a8efff66}
.moon{position:absolute;top:16px;right:7px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#ffdda0 50%,#9871b8);box-shadow:0 0 18px #ffe3a3;animation:float 3.4s ease-in-out infinite}
.panel{background:linear-gradient(145deg,#1b1839f2,#0d0b21f2);border:1px solid var(--line);border-radius:25px;padding:clamp(22px,5vw,42px);box-shadow:0 24px 80px #0005}
.btn{border:1px solid #cbb8ff65;background:#17152f;color:var(--text);border-radius:999px;padding:12px 18px;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 0 22px #b59aff22}
.primary{background:linear-gradient(110deg,#ffe6a6,#d8c4ff);color:#211634;border:0;font-weight:750}
.ghost{background:transparent}
.actions{display:flex;gap:11px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.planet-map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.planet-link{
  min-height:160px;background:transparent;color:var(--text);
  border:1px solid transparent;border-radius:19px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:9px;
  transition:.25s;position:relative;isolation:isolate;
}
.planet-link:hover{border-color:var(--line);background:#c8b4ff0b;transform:translateY(-4px)}
.planet-link:before{
  content:"";position:absolute;width:110px;height:110px;border-radius:50%;
  background:#ad8cff0a;filter:blur(17px);z-index:-1;
}
.planet{
  position:relative;width:67px;height:67px;border-radius:50%;
  animation:float var(--float-speed,5s) ease-in-out infinite,
            drift var(--drift-speed,8s) ease-in-out infinite,
            pulseGlow var(--glow-speed,4.5s) ease-in-out infinite;
  box-shadow:0 0 30px #b7a2ff35;
}
.planet:after{content:"";position:absolute;inset:15px -7px;border:1px solid #ffffff7c;border-radius:50%;transform:rotate(-28deg)}
.planet-link:nth-child(3n+1) .planet{--float-speed:4.1s;--drift-speed:7s;--glow-speed:3.8s}
.planet-link:nth-child(3n+2) .planet{--float-speed:6.2s;--drift-speed:9s;--glow-speed:5.4s}
.planet-link:nth-child(3n) .planet{--float-speed:5s;--drift-speed:6.7s;--glow-speed:4.4s}
.p1{background:radial-gradient(circle at 27% 24%,#f8e5ff,#a57cdd 34%,#24204b 80%)}
.p2{background:radial-gradient(circle at 27% 24%,#fff4c9,#e0a96a 34%,#4c285b 80%)}
.p3{background:radial-gradient(circle at 27% 24%,#dcffff,#58b8c6 34%,#142746 80%)}
.p4{background:radial-gradient(circle at 27% 24%,#ffe5f4,#eb8fbd 34%,#4d265d 80%)}
.p5{background:radial-gradient(circle at 27% 24%,#fff9df,#bca4de 34%,#31325c 80%)}
.p6{background:radial-gradient(circle at 27% 24%,#f5f4ff,#a9c1eb 34%,#242b5b 80%)}
.planet-name{font-size:.9rem;font-weight:750}
.planet-caption{font-size:.66rem;color:#aaa2ca;letter-spacing:.08em}
.chapter-head{display:flex;gap:14px;align-items:center;margin-bottom:24px}
.chapter-icon{width:50px;height:50px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#cbb8ff10;font-size:1.4rem;flex-shrink:0}
.chapter-head h2{margin:5px 0 0}
.split{display:grid;grid-template-columns:1fr .8fr;gap:25px}
.quote{border-left:2px solid var(--pink);padding:7px 0 7px 17px;color:#f8dcef;font:1.35rem/1.55 Georgia,serif;margin:20px 0}
.stamp{display:inline-block;border:1px solid #a8efff55;border-radius:999px;padding:8px 11px;color:var(--blue);font-size:.67rem;letter-spacing:.08em}
.stars-line{font-size:1.25rem;color:var(--gold);letter-spacing:.35em;margin-top:25px}
.progress{height:3px;background:#ffffff17;border-radius:9px;margin-bottom:20px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .5s}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:30px}
.page-count{font-size:.78rem;color:#a6a0c8}
.note{border:1px dashed #ffe3a366;padding:15px;border-radius:15px;color:var(--gold);margin-top:18px;line-height:1.7}
.sla{border:1px solid var(--line);border-radius:17px;background:#0c0b22;padding:17px;margin-top:22px}
.sla-title{font-size:.68rem;color:var(--blue);letter-spacing:.14em;font-weight:800}
.sla ul{list-style:none;padding:0;margin:12px 0 0}
.sla li{padding:9px 0;border-bottom:1px solid #ffffff10;color:#ddd5f0}
.sla li:last-child{border-bottom:0}
.sla li:before{content:"✦ ";color:var(--gold)}
.answer-list{display:grid;gap:10px;margin:20px 0}
.answer{width:100%;text-align:left;background:#100f29;color:var(--text);border:1px solid var(--line);padding:14px;border-radius:13px}
.answer:hover{border-color:var(--gold)}
.answer.correct{border-color:#9be7c4;background:#17342d}
.answer.wrong{border-color:var(--pink);background:#3c1a37}
.feedback{color:var(--gold);min-height:30px;font-size:.9rem;line-height:1.6;margin-top:14px}
.memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:23px}
.memory{padding:18px;border-radius:16px;text-align:left;background:#11102a;border:1px solid var(--line);color:var(--text);transition:.2s}
.memory:hover{transform:translateY(-3px);border-color:var(--pink)}
.memory b{display:block;color:#f5e7ff;margin-bottom:8px}
.memory span{font-size:.88rem;line-height:1.6;color:#c7bfdc}
.sky{height:130px;position:relative;margin:10px 0 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,transparent,#17153677)}
.sky:before{content:"";position:absolute;width:140px;height:140px;border:1px solid #d8c8ff38;border-radius:50%;left:50%;top:8px;transform:translateX(-50%)}
.sky:after{content:"✦";position:absolute;left:50%;top:30px;color:var(--gold);font-size:1.9rem;text-shadow:0 0 22px var(--gold);animation:float 3s infinite}
.secret{display:none}
.secret.show{display:block;animation:pop .25s ease}
.bat-button{
  position:fixed;right:15px;bottom:14px;z-index:20;
  border:1px solid #cbb8ff65;background:#17132eeF;color:white;
  border-radius:50%;width:49px;height:49px;font-size:1.3rem;
  box-shadow:0 0 22px #a88bff22;animation:float 4s ease-in-out infinite;
}
.toast-overlay{
  position:fixed;inset:0;z-index:100;background:#05030bd1;
  display:grid;place-items:center;padding:20px;
  backdrop-filter:blur(8px);
}
.toast{
  width:min(440px,100%);position:relative;text-align:center;
  background:linear-gradient(145deg,#25204a,#100d25);
  border:1px solid #cbb3ff6b;border-radius:24px;
  padding:30px 24px;box-shadow:0 25px 100px #0009;
  animation:pop .25s ease;
}
.toast-icon{font-size:2.1rem;margin-bottom:10px;animation:wiggle 2.5s ease-in-out infinite}
.toast .eyebrow{margin-bottom:10px}
.toast h3{margin:8px 0 12px;font-size:1.7rem}
.toast p{margin:0 auto 20px;line-height:1.75}
.toast-close{min-width:135px}
.toast small{display:block;margin-top:15px;color:#aaa2ca;font-size:.72rem}
.travel-overlay{
  position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,#28204e,#05030d 70%);
  overflow:hidden;text-align:center;padding:24px;
}
.travel-overlay:before,.travel-overlay:after{
  content:"";position:absolute;width:2px;height:100vh;
  background:linear-gradient(transparent,#d9c5ff,transparent);
  opacity:0;animation:streak 1.2s linear infinite;
}
.travel-overlay:after{animation-delay:.4s;left:35%}
.travel-content{position:relative;z-index:1}
.travel-content .planet{width:100px;height:100px;margin:22px auto;animation:flyPlanet 1.8s ease both,pulseGlow 1s infinite}
.travel-content h2{font-size:clamp(2rem,6vw,3rem);margin:12px 0}
.travel-content p{max-width:440px;margin:0 auto;color:#dcd5ee}
footer{text-align:center;padding:0 16px 24px;color:#8e89ae;font-size:.75rem}
@media(max-width:650px){
  header{padding:17px;font-size:.67rem}header span{display:none}
  main{width:calc(100% - 22px);padding-top:12px}
  .panel{padding:22px 17px;border-radius:20px}
  .planet-map{grid-template-columns:repeat(2,1fr);gap:4px}
  .planet-link{min-height:135px}.planet{width:58px;height:58px}
  .split{grid-template-columns:1fr;gap:8px}
  .memory-grid{grid-template-columns:1fr}
  .chapter-head h2{font-size:2rem}
  .nav-row .btn{padding:10px 12px;font-size:.82rem}
  .toast{padding:26px 19px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header>
  <div>✦ BATMAN <strong>×</strong> BEE</div>
  <span>OUR LITTLE GALAXY · 11 OCTOBER 2025</span>
</header>
<main id="app" aria-live="polite"></main>
<footer>Made of stardust, silly theories, late-night conversations, and one beginning. ✦</footer>

<button class="bat-button" id="batButton" aria-label="Tap Batman for a message" title="Batman has a policy for that">🦇</button>
<div id="popupRoot"></div>
<div id="travelRoot"></div>

<script>
const chapters=[
 {id:"origin",label:"The First Hello",icon:"☄",eyebrow:"ORBIT 01 · THE FIRST HELLO",
 title:"A stands for Amazing.",
 popup:"Warning: contains unsolicited life planning and suspiciously early discussions of the next 50 years.",
 popupTitle:"WELCOME TO SCHMOOZE",
 body:[
 "We met on Schmooze on October 11, 2025. One right swipe later, I was unknowingly entering a long-term conversation with a man who apparently considered my employment status a personal mission.",
 "You asked why I was joining a job at 21. Most people say, “Oh, nice.” You opened a mental Excel sheet and started planning my career.",
 "Then came Mission Jobs. Deadline: November 1. Stakeholder: Batman. Project owner: also Batman. Bee had not even completed onboarding."
 ],quote:"“Swiping right on me has perks.”",
 tag:"OFFICIAL INCIDENT REPORT",
 side:"The perks included unsolicited career consulting. The terms and conditions were not disclosed."},

 {id:"voice",label:"The First Voice",icon:"🎙️",eyebrow:"ORBIT 02 · THE FIRST VOICE",
 title:"A meeting that was definitely about the resume.",
 popup:"Achievement unlocked: You survived the resume meeting that was definitely just about the resume.",
 popupTitle:"MEETING INVITATION ACCEPTED",
 body:[
 "You asked me out before leaving for Delhi. I said no because I had classes. Batman immediately pivoted to a Google Meet to discuss my resume.",
 "A completely professional meeting. Very normal. Absolutely no suspicious circumstances.",
 "It was the first time I heard your voice. And somehow, a resume review became one of those tiny moments that would get its own dedicated planet on a website almost a year later."
 ],quote:"“We are in the same team.”",
 tag:"TEAM STRUCTURE: QUESTIONABLE",
 side:"The team had two members, zero formal onboarding, and an alarming number of conversations."},

 {id:"batman",label:"Batman Lore",icon:"🦇",eyebrow:"ORBIT 03 · BATMAN'S TERMS & CONDITIONS",
 title:"Romance, subject to policy approval.",
 popup:"Caution: Batman Lore contains unsolicited life planning, suspiciously early marriage negotiations, and one extremely specific 2 AM husband clause.",
 popupTitle:"READ THE TERMS BEFORE PROCEEDING",
 body:[
 "No-divorce policy. Two-kids opinions. Seven kisses per day. Good morning messages as a recurring deliverable.",
 "And then, with the confidence of a man presenting his five-year strategic plan, you asked whether I was scared of waking up beside you for the next 50 years.",
 "Sir. We had barely finished the introductory chapter.",
 "Batman was out here discussing the lifetime subscription before Bee had even located the cancellation policy."
 ],quote:"“Aren’t you scared of waking up to me every day for the next 50 years?”",
 tag:"PROPOSED SERVICE-LEVEL AGREEMENT",
 side:"The fine print was extensive.",
 list:["Daily kisses: 7","Good morning messages: recurring","Children: 2, subject to future discussions","Contract duration: 50 years","Legal department: Batman himself"],
 extraTitle:"🦇 THE 2 AM HUSBAND CLAUSE",
 extra:[
 "Somewhere in a conversation about his dream of becoming a therapist after turning 50, I apparently had to attend a surprise compatibility interview.",
 "I asked him to pursue the dream he'd talked about.",
 "And then came the question:"
 ],extraQuote:"“Is it okay for you if your husband comes home by 2 AM every day?”",
 extraAfter:[
 "SIR. 😭",
 "We were discussing your career dream. How did I end up negotiating the working hours of my hypothetical future husband?",
 "But underneath the ridiculousness was something rather sweet: we were imagining a future where he actually became that therapist, and I was being asked whether I could picture a life with him and the realities of that dream."
 ],extraEnd:"Batman: planning his post-50 career.\nMe: apparently already in the wife interview round.",
 extraTag:"NO HR DEPARTMENT COULD HAVE PREPARED ME FOR THIS."},

 {id:"applebee",label:"Apple-Bee Science",icon:"🍎",eyebrow:"ORBIT 04 · APPLE-BEE SCIENCE",
 title:"Einstein could never.",
 popup:"Welcome to the Institute of Questionable Economics. Your degree will not be recognised by any legitimate university.",
 popupTitle:"UNACCREDITED SCIENCE ZONE",
 body:[
 "Batman explained that a bee doesn't need to get sweetness only from flowers. It can get sweetness from an apple, too.",
 "Somewhere between economics, diminishing marginal utility, and whatever was happening in that man's brain, we accidentally founded a new branch of science.",
 "NASA, if you're reading this, please fund our research."
 ],quote:"“That bee doesn’t need to eat honey from the flowers but also from the apple.”",
 tag:"PEER REVIEW PENDING",
 side:"The bee has declined to comment.",
 quiz:true},

 {id:"bee",label:"The Bee Files",icon:"🐝",eyebrow:"ORBIT 05 · THE BEE FILES",
 title:"One girl. Approximately 47 nicknames.",
 popup:"Welcome to the Bee Files. Please declare all known aliases, celebrity crushes, and potential future pets at customs.",
 popupTitle:"BEE: A MULTI-FORM CHARACTER",
 body:[
 "First, mommy. Then Monica Geller. Then panda ma. Then Panda Bee.",
 "At some point, I stopped being a person and became a franchise with multiple spin-offs.",
 "Jackson Wang was a threat to national security. Future cats and dogs were potential competitors for your attention allocation. And “the cute” somehow became a category of its own."
 ],quote:"“The cat will always land on its feet.”",
 tag:"SCIENTIFIC FINDINGS",
 side:"The cat has survival instincts. Batman has jealousy. Only one of these is a scientifically established phenomenon."},

 {id:"memories",label:"Tiny Universes",icon:"✨",eyebrow:"ORBIT 06 · TINY UNIVERSES",
 title:"Evidence that we needed supervision.",
 popup:"Museum rules: no touching the exhibits, no explaining the tiger thought to normal people, and no contacting Jackson Wang.",
 popupTitle:"THE MUSEUM OF QUESTIONABLE LORE",
 body:[
 "None of these events would survive a normal person's attempt to explain them. Which is precisely why they belong in a museum."
 ],tag:"THE MUSEUM IS NOW OPEN",museum:true},

 {id:"diwali",label:"The Diwali Flight",icon:"✈️",eyebrow:"ORBIT 07 · THE DIWALI FLIGHT",
 title:"Airport logistics, starring two clowns.",
 popup:"Flight announcement: Batman has departed for Delhi. Bee is at the window conducting unofficial air-traffic control.",
 popupTitle:"NOW BOARDING: FEELINGS",
 body:[
 "You had an early flight to Delhi. We made a bet about whether you'd reach the airport early or just in time.",
 "You reached early. I declared myself the winner anyway because you were a gentleman.",
 "I was at my window trying to say goodbye to a plane I couldn't even reliably predict the direction of. It didn't fly over Anna University, which was apparently relevant to our aviation research.",
 "And then we exchanged our first voice notes."
 ],quote:"FLIGHT STATUS: DEPARTED.",
 tag:"NO AIR-TRAFFIC-CONTROL AUTHORITY",
 side:"Passenger transported to Delhi. One voice note delivered. One Bee stationed at a window with absolutely no air-traffic-control authority.",sky:true},

 {id:"safe",label:"Same Team",icon:"🌙",eyebrow:"ORBIT 08 · SAME TEAM",
 title:"Feelings entered the chat.",
 popup:"Warning: this chapter contains softness. Batman has temporarily suspended all policy presentations.",
 popupTitle:"NO JOKES FOR A SECOND",
 body:[
 "You told me I was your safe space, and that you were mine. That I could be myself even if you never became my boyfriend.",
 "Then came “Why make war when you can make love?” and “We are in the same team.”",
 "For once, Batman stopped presenting policy documents and said something soft."
 ],quote:"“We are in the same team.”",
 tag:"A MEMORY, HELD GENTLY",
 side:"No jokes here for a second. Some memories deserve to be held gently, not turned into a punchline."},

 {id:"end",label:"The Time Capsule",icon:"🌌",eyebrow:"FINAL ORBIT · TIME CAPSULE",
 title:"And that's how the lore began.",
 popup:"Congratulations. You have completed the lore. Unfortunately, there is no certification for understanding this man.",
 popupTitle:"MISSION COMPLETE",
 body:[
 "October 11, 2025. One swipe. One Amazing question. One man who apparently moonlighted as a career counsellor, economist, aviation analyst, and marriage-policy consultant.",
 "One girl who came for a conversation and accidentally became a recurring character in all of the above.",
 "The universe is enormous. The odds of meeting are ridiculous. And somehow, ours began with a swipe on Schmooze."
 ],quote:"END OF CHAPTER ONE.",
 tag:"THE BATMAN REMAINS UNDER INVESTIGATION.",
 side:"The lore is extensive. The documentation is incomplete."}
];

const exhibits=[
 ["“Avan kedakuran.”","The manager apparently wasn't going to stop the talking.","A tiny work-hours rebellion in the name of talking to Bee."],
 ["The perfect crime","Two people stealing each other's hearts and somehow neither pressing charges.","A flawless heist. The authorities remain confused."],
 ["The tiger thought","Handling a tiger is easier than thinking about handling a tiger.","Batman briefly became Buddha. Briefly."],
 ["The Delhi house","A house tour that somehow included being jealous of your own dad.","A deeply niche entry in the Batman files."],
 ["Jackson Wang","Celebrity-crush jealousy was apparently a serious matter.","Jackson Wang was placed under observation."],
 ["Diminishing marginal utility","Even flirting could turn into an economics lesson.","Romance, but make it a lecture."],
 ["The Green Lantern reference","A story about asking someone to marry you after two days because you already knew, but didn't want to startle her.","Fastest proposal timeline in the cinematic universe."],
 ["The pet policy","Future cats and dogs were potential competitors for attention.","All prospective pets must submit an application."]
];

let current="home";
let hasSeenIntro={};
let travelTimer=null;
const app=document.getElementById("app");
const popupRoot=document.getElementById("popupRoot");
const travelRoot=document.getElementById("travelRoot");

function btn(label,action,cls="btn"){
 return `<button class="${cls}" data-action="${action}">${label}</button>`;
}
function chapterIndex(){return chapters.findIndex(c=>c.id===current)}
function toast(title,message,icon="✨",buttonText="Okay, continue"){
 popupRoot.innerHTML=`<div class="toast-overlay" role="dialog" aria-modal="true" aria-label="${title.replace(/"/g,"&quot;")}">
  <div class="toast">
   <div class="toast-icon">${icon}</div>
   <div class="eyebrow">INCOMING TRANSMISSION</div>
   <h3>${title}</h3>
   <p>${message}</p>
   <button class="btn primary toast-close" data-action="close-popup">${buttonText}</button>
   <small>Officially unofficial. Signed, the Galactic Department of Lore.</small>
  </div></div>`;
}
function closeToast(){popupRoot.innerHTML=""}
function showChapter(id){
 const c=chapters.find(x=>x.id===id);
 if(!c)return;
 current=id;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
 if(!hasSeenIntro[id]){
  hasSeenIntro[id]=true;
  toast(c.popupTitle||c.label,c.popup||"Another chapter of the lore has been unlocked.",c.icon||"✨",
    id==="end"?"Accept my honorary degree":"Enter this planet");
 }
}
function travelTo(id){
 const c=chapters.find(x=>x.id===id);
 if(!c)return;
 closeToast();
 travelRoot.innerHTML=`<div class="travel-overlay">
  <div class="travel-content">
   <div class="eyebrow">ENGAGING WARP DRIVE</div>
   <div class="planet p${chapters.indexOf(c)%6+1}"></div>
   <h2>Travelling to ${c.label}…</h2>
   <p>Kindly remain seated. The spaceship has no seatbelts, no refreshments, and Batman is not a licensed pilot.</p>
   <p style="margin-top:20px;color:var(--gold)">✦ · ˚ ✧ · 🚀 · ✧ ˚ · ✦</p>
  </div></div>`;
 const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 travelTimer=setTimeout(()=>{
  travelRoot.innerHTML="";
  showChapter(id);
 },reduced?50:1750);
}
function nav(){
 const i=chapterIndex();
 const next=i<chapters.length-1?chapters[i+1]:null;
 return `<div class="nav-row">
  ${btn("← Galaxy map","map","btn ghost")}
  <span class="page-count">ORBIT ${String(i+1).padStart(2,"0")} / ${chapters.length}</span>
  ${next?btn("Next orbit →","next","btn primary"):btn("Finish the tour ✦","finish","btn primary")}
 </div>`;
}
function head(c){
 return `<div class="chapter-head"><div class="chapter-icon">${c.icon}</div>
 <div><div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2></div></div>`;
}
function progress(){
 return `<div class="progress"><span style="width:${(chapterIndex()+1)/chapters.length*100}%"></span></div>`;
}
function home(){
 app.innerHTML=`<section class="scene hero">
  <div class="cosmos"><div class="orbit"></div><div class="orbit two"></div><div class="core"></div><div class="moon"></div></div>
  <div class="eyebrow">A TIME CAPSULE · 11 OCTOBER 2025</div>
  <h1>Somewhere in this universe,<br><em>Batman met Bee.</em></h1>
  <p>One hello on Schmooze. A whole cinematic universe of career consulting, suspiciously early future planning, questionable economics, and tiny moments worth keeping.</p>
  <div class="actions">${btn("Enter our galaxy ✦","map","btn primary")}</div>
  <p style="font-size:.78rem;color:#938bad;margin-top:18px">Tap a planet. Open a memory. Batman's terms and conditions are non-negotiable.</p>
 </section>`;
}
function map(){
 app.innerHTML=`<section class="scene panel">
  <div class="eyebrow">CHOOSE YOUR DESTINATION</div><h2>Our little galaxy.</h2>
  <p>Every planet contains one chapter of the lore. Tap a planet to begin the landing sequence, then open the chapter when you arrive. Interplanetary travel is unpaid.</p>
  <div class="planet-map">${chapters.map((c,i)=>`<button class="planet-link" data-go="${c.id}" aria-label="Travel to ${c.label}">
   <span class="planet p${i%6+1}"></span><span class="planet-name">${c.label}</span>
   <span class="planet-caption">ORBIT ${String(i+1).padStart(2,"0")} · TRAVEL</span></button>`).join("")}</div>
  <div class="actions">${btn("Launch from Orbit 01 →","go-origin","btn primary")}
  ${btn("🎲 Random destination","random","btn")}
  ${btn("✨ Find a hidden star","hidden-star","btn")}
  ${btn("🦇 Classified Batman files","secret","btn ghost")}</div>
  <div id="secret" class="note secret">CLASSIFIED: Batman has been accused of turning casual conversations into long-term strategic planning. He is also suspected of bringing up a 50-year subscription before the trial period ended. 🕵️</div>
 </section>`;
}
function renderStory(c){
 let extra="";
 if(c.list)extra+=`<div class="sla"><div class="sla-title">${c.tag}</div><ul>${c.list.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
 if(c.extraTitle){
  extra+=`<div class="note"><h3 style="margin-top:0">${c.extraTitle}</h3>
  ${c.extra.map(x=>`<p>${x}</p>`).join("")}
  <div class="quote">${c.extraQuote}</div>
  ${c.extraAfter.map(x=>`<p>${x}</p>`).join("")}
  <p style="white-space:pre-line;color:var(--gold);font-weight:700">${c.extraEnd}</p>
  <div class="eyebrow">${c.extraTag}</div></div>`;
 }
 if(c.quiz){
  extra+=`<div class="sla"><div class="sla-title">THE INTERGALACTIC BEE INSTITUTE 🍎🐝</div>
  <p>What was Batman trying to say with the Apple-Bee theory?</p>
  <div class="answer-list">
   <button class="answer" data-answer="wrong">Bees should stop visiting flowers.</button>
   <button class="answer" data-answer="correct">Sweetness can come from more than one place.</button>
   <button class="answer" data-answer="wrong">Apple is scientifically better than honey.</button>
  </div><div class="feedback" id="feedback"></div></div>`;
 }
 app.innerHTML=`<section class="scene">${progress()}<div class="panel">${head(c)}
  ${c.sky?'<div class="sky"></div>':""}
  <div class="split"><div>${c.body.map(x=>`<p>${x}</p>`).join("")}</div>
  <div><div class="quote">${c.quote}</div>${c.side?`<p>${c.side}</p>`:""}
  <div class="stamp">${c.tag}</div><div class="stars-line">✦ · ˚ ✧ ˚ · ✦</div></div></div>
  ${extra}${nav()}</div></section>`;
}
function renderMuseum(c){
 app.innerHTML=`<section class="scene">${progress()}<div class="panel">${head(c)}
 ${c.body.map(x=>`<p>${x}</p>`).join("")}
 <div class="memory-grid">${exhibits.map((m,i)=>`<button class="memory" data-memory="${i}">
 <b>${m[0]}</b><span>${m[1]}</span></button>`).join("")}</div>
 <div class="feedback" id="feedback">Tap an exhibit to receive the curator's deeply unnecessary commentary.</div>
 ${nav()}</div></section>`;
}
function renderEnd(c){
 app.innerHTML=`<section class="scene"><div class="panel" style="text-align:center">
 <div class="cosmos"><div class="orbit"></div><div class="orbit two"></div><div class="core"></div><div class="moon"></div></div>
 <div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2>
 ${c.body.map(x=>`<p style="max-width:670px;margin:0 auto 15px">${x}</p>`).join("")}
 <div class="quote">${c.quote}</div><div class="stamp">${c.tag}</div>
 <p>${c.side}</p><div class="actions">${btn("Back to the galaxy ✦","map","btn primary")}${btn("Start again","home","btn")}${btn("Claim fake certificate 🎓","certificate","btn")}</div>
 </div></section>`;
}
function render(){
 if(current==="home")return home();
 if(current==="map")return map();
 const c=chapters.find(x=>x.id===current);
 if(!c)return home();
 if(c.museum)return renderMuseum(c);
 if(current==="end")return renderEnd(c);
 renderStory(c);
}
function go(id){current=id;render();window.scrollTo({top:0,behavior:"smooth"})}
function nextOrbit(){
 const i=chapterIndex();
 if(i>=0&&i<chapters.length-1)travelTo(chapters[i+1].id);
 else toast("MISSION COMPLETE","Congratulations. You have completed the lore. Unfortunately, there is no certification for understanding this man.","🌌","Back to the galaxy");
}
const batMessages=[
 ["BATMAN POLICY DEPARTMENT","Batman is busy drafting another policy. Please try again after seven kisses.","🦇"],
 ["URGENT MEMO","Your request has been forwarded to the Department of Hypothetical Future Husbands.","📑"],
 ["SYSTEM STATUS","Batman is online. He is probably about to ask a question with a 50-year time horizon.","🕵️"],
 ["LEGAL NOTICE","All spontaneous conversations may be converted into long-term strategic plans without prior warning.","⚖️"]
];
let batCount=0;
function batPopup(){
 const m=batMessages[batCount%batMessages.length];batCount++;
 toast(m[0],m[1],m[2],"Fine, Batman");
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button");
 if(!b)return;
 if(b.dataset.go){travelTo(b.dataset.go);return}
 if(b.dataset.action==="close-popup"){closeToast();return}
 const a=b.dataset.action;
 if(a==="map"){closeToast();go("map")}
 if(a==="home"){closeToast();go("home")}
 if(a==="go-origin"){travelTo("origin")}
 if(a==="next"){closeToast();nextOrbit()}
 if(a==="finish"){toast("MISSION COMPLETE","Congratulations. You have completed the lore. Unfortunately, there is no certification for understanding this man.","🌌","Back to the galaxy")}
 if(a==="random"){
  const choices=chapters.filter(c=>c.id!=="end");
  travelTo(choices[Math.floor(Math.random()*choices.length)].id);
 }
 if(a==="secret"){
  const s=document.getElementById("secret");
  if(s){s.classList.toggle("show");if(s.classList.contains("show"))toast("CLASSIFIED FILE OPENED","Batman has been accused of turning casual conversations into long-term strategic planning. The 50-year subscription is still under investigation.","🕵️","Close file")}
 }
 if(a==="hidden-star"){
  toast("ACHIEVEMENT UNLOCKED","You survived the resume meeting that was definitely just about the resume. Reward: one imaginary badge and permanent membership in the lore.","⭐","Accept badge");
 }
 if(a==="certificate"){
  toast("CERTIFICATE DENIED","The Institute of Questionable Economics, the Department of Marriage Policies, and the Galactic Board of Aviation have all refused accreditation.","🎓","I demand a refund");
 }
 if(b.dataset.answer){
  const f=document.getElementById("feedback");
  if(b.dataset.answer==="correct"){
   app.querySelectorAll("[data-answer]").forEach(x=>{
    x.disabled=true;if(x.dataset.answer==="correct")x.classList.add("correct");
   });
   f.textContent="Correct! The Apple-Bee Institute awards you a completely unaccredited degree. 🍎🐝";
   toast("DEGREE AWARDED","Welcome to the Institute of Questionable Economics. Your degree will not be recognised by any legitimate university.","🍎🐝","I accept my degree");
  }else{
   b.disabled=true;b.classList.add("wrong");
   f.textContent="Incorrect. Please retake the course. Tuition is payable in seven kisses.";
   toast("ACADEMIC MISCONDUCT","That answer has been referred to Batman's Department of Unnecessary Follow-up Questions.","📚","I'll study harder");
  }
 }
 if(b.dataset.memory!==undefined){
  const m=exhibits[Number(b.dataset.memory)];
  document.getElementById("feedback").textContent=m[2];
  toast(m[0],m[2],"✨","Return to museum");
 }
});
document.getElementById("batButton").addEventListener("click",batPopup);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeToast();
});
render();
</script>
</body>
</html>
