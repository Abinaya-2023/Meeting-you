
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070817">
<title>Batman & Bee — Our Little Galaxy</title>

<style>
:root {
  --bg: #070817;
  --panel: rgba(20, 20, 53, .88);
  --text: #f7f1ff;
  --muted: #c4bddc;
  --gold: #ffe6a6;
  --lilac: #c9a9ff;
  --pink: #ffb6dc;
  --cyan: #a8efff;
  --border: rgba(220, 211, 255, .24);
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(ellipse at 12% 15%, #47266d66, transparent 38%),
    radial-gradient(ellipse at 88% 28%, #174b7066, transparent 36%),
    radial-gradient(ellipse at 55% 100%, #58245144, transparent 40%),
    var(--bg);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 10% 20%, white, transparent),
    radial-gradient(1px 1px at 35% 70%, white, transparent),
    radial-gradient(2px 2px at 70% 18%, #d6c5ff, transparent),
    radial-gradient(1px 1px at 82% 82%, white, transparent),
    radial-gradient(2px 2px at 55% 45%, #a8efff, transparent),
    radial-gradient(1px 1px at 25% 38%, white, transparent);
  background-size: 280px 260px;
  animation: stars 7s ease-in-out infinite alternate;
}

@keyframes stars {
  from { opacity: .3; }
  to { opacity: .9; }
}

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

header {
  max-width: 1050px;
  margin: auto;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: .78rem;
  letter-spacing: .12em;
}

header strong { color: var(--gold); }

main {
  width: min(920px, calc(100% - 32px));
  min-height: 78vh;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 0 40px;
}

.scene {
  width: 100%;
  animation: appear .4s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

h1, h2 {
  font-family: Georgia, serif;
  font-weight: 400;
  letter-spacing: -.035em;
}

h1 {
  font-size: clamp(2.8rem, 8vw, 5.6rem);
  line-height: 1.02;
  margin: 20px 0;
}

h2 {
  font-size: clamp(2.1rem, 5vw, 3.6rem);
  line-height: 1.08;
  margin: 12px 0 20px;
}

p {
  color: #d8d2ec;
  line-height: 1.85;
}

em { color: var(--gold); font-style: normal; }

.eyebrow {
  color: var(--cyan);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .19em;
  text-transform: uppercase;
}

.hero { text-align: center; padding: 30px 0; }

.hero p {
  max-width: 580px;
  margin: 0 auto 24px;
}

.cosmos {
  position: relative;
  width: 175px;
  height: 175px;
  margin: 0 auto 25px;
  display: grid;
  place-items: center;
}

.core {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: radial-gradient(circle at 28% 25%, #fff, #c9a9ff 15%, #7251c9 45%, #14163e 78%);
  box-shadow: 0 0 30px #9e7aff88, 0 0 85px #7554d455;
}

.orbit {
  position: absolute;
  width: 165px;
  height: 60px;
  border: 1px solid #d4c8ff99;
  border-radius: 50%;
  transform: rotate(-28deg);
}

.orbit.two {
  width: 145px;
  height: 95px;
  transform: rotate(45deg);
  border-color: #89eaff66;
}

.moon {
  position: absolute;
  top: 20px;
  right: 12px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, white, #ffdca0 50%, #a477cb);
  box-shadow: 0 0 18px #ffdca0;
}

.panel {
  padding: clamp(22px, 5vw, 42px);
  border: 1px solid var(--border);
  border-radius: 24px;
  background: linear-gradient(145deg, #191940e8, #090b20ed);
  box-shadow: 0 20px 70px #0005;
}

.btn {
  border: 1px solid #c8baff66;
  background: #171735;
  color: var(--text);
  border-radius: 999px;
  padding: 12px 18px;
  transition: .2s;
}

.btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  box-shadow: 0 0 20px #9d7bff30;
}

.btn.primary {
  color: #17132b;
  background: linear-gradient(110deg, #ffe8b0, #d9c1ff);
  border: none;
  font-weight: 750;
}

.btn.ghost { background: transparent; }

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 25px;
}

.planet-map {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 25px 0;
}

.planet-link {
  min-height: 145px;
  padding: 12px 5px;
  border: 1px solid transparent;
  border-radius: 18px;
  background: transparent;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: .25s;
}

.planet-link:hover {
  border-color: var(--border);
  background: #b7a5ff0c;
  transform: translateY(-4px);
}

.planet {
  width: 63px;
  height: 63px;
  border-radius: 50%;
  box-shadow: 0 0 25px #9f80ff35;
  position: relative;
}

.planet::after {
  content: "";
  position: absolute;
  inset: 15px -7px;
  border: 1px solid #ffffff77;
  border-radius: 50%;
  transform: rotate(-28deg);
}

.p1 { background: radial-gradient(circle at 28% 25%, #f5d9ff, #9875db 30%, #25234f 78%); }
.p2 { background: radial-gradient(circle at 28% 25%, #fff3c9, #d9a45f 30%, #493064 78%); }
.p3 { background: radial-gradient(circle at 28% 25%, #d4ffff, #4da6bc 30%, #14294d 78%); }
.p4 { background: radial-gradient(circle at 28% 25%, #ffe4f4, #e98bb9 30%, #49265d 78%); }
.p5 { background: radial-gradient(circle at 28% 25%, #fff8dc, #c3a4d8 30%, #33345f 78%); }
.p6 { background: radial-gradient(circle at 28% 25%, #f7f3ff, #aeb4e6 30%, #282d62 78%); }

.planet-name { font-size: .9rem; font-weight: 700; }
.planet-caption { color: #a9a4ca; font-size: .68rem; }

.chapter-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 25px;
}

.chapter-icon {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: #bba7ff12;
  font-size: 1.4rem;
}

.chapter-head h2 { margin: 6px 0 0; }

.split {
  display: grid;
  grid-template-columns: 1fr .85fr;
  gap: 25px;
}

.quote {
  border-left: 2px solid var(--pink);
  padding: 7px 0 7px 17px;
  color: #f5d9ee;
  font: 1.35rem/1.55 Georgia, serif;
  margin: 18px 0 24px;
}

.stamp {
  display: inline-block;
  border: 1px solid #a8efff55;
  border-radius: 999px;
  padding: 8px 11px;
  color: var(--cyan);
  font-size: .7rem;
  letter-spacing: .08em;
}

.stars-line {
  margin-top: 25px;
  color: var(--gold);
  letter-spacing: .4em;
  font-size: 1.3rem;
}

.progress {
  height: 3px;
  background: #ffffff15;
  border-radius: 9px;
  margin-bottom: 22px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--lilac), var(--cyan));
}

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 30px;
}

.page-count { color: #a6a0c8; font-size: .8rem; }

.answer-list { display: grid; gap: 10px; margin: 20px 0; }

.answer {
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid #bcb2e344;
  background: #11132f;
  color: #eee8ff;
}

.answer:hover { border-color: var(--gold); }
.answer.correct { border-color: #a9f0cf; background: #15372f; }
.answer.wrong { border-color: #ffb6dc; background: #391b38; }
.feedback { color: var(--gold); min-height: 28px; font-size: .9rem; }

.memory-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 22px;
}

.memory {
  border: 1px solid #bdb0e333;
  background: #10122d;
  border-radius: 15px;
  padding: 17px;
  color: var(--text);
  text-align: left;
}

.memory b { display: block; margin-bottom: 7px; color: #f4e6ff; }
.memory span { color: #c8c0df; font-size: .9rem; line-height: 1.6; }

.airport-sky {
  height: 145px;
  position: relative;
  margin: 10px 0 25px;
  border-bottom: 1px solid #d9d0ff35;
  background: linear-gradient(180deg, transparent, #17153677);
}

.airport-sky::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border: 1px solid #d8c8ff38;
  border-radius: 50%;
  left: 50%;
  top: 15px;
  transform: translateX(-50%);
}

.airport-sky::after {
  content: "✦";
  position: absolute;
  left: 50%;
  top: 40px;
  color: #ffe9b0;
  font-size: 1.8rem;
  text-shadow: 0 0 20px #ffe9b0;
  animation: stars 2s infinite alternate;
}

.final-orbit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 28px 0;
  font-size: 2rem;
}

.final-orbit i {
  width: 90px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #cbbaff, transparent);
}

footer {
  text-align: center;
  color: #8e89ae;
  font-size: .75rem;
  padding: 0 16px 24px;
}

@media (max-width: 650px) {
  header { padding: 16px; font-size: .68rem; }
  header span { display: none; }
  main { width: calc(100% - 24px); align-items: flex-start; padding-top: 15px; }
  .hero { padding-top: 20px; }
  .planet-map { grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .planet-link { min-height: 130px; }
  .planet { width: 57px; height: 57px; }
  .panel { padding: 22px 17px; border-radius: 20px; }
  .split { grid-template-columns: 1fr; gap: 8px; }
  .memory-grid { grid-template-columns: 1fr; }
  .nav-row .btn { padding: 11px 13px; font-size: .85rem; }
  .chapter-head h2 { font-size: 2.05rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<header>
  <div>✦ BATMAN <strong>×</strong> BEE</div>
  <span>OUR LITTLE GALAXY · 11 OCTOBER 2025</span>
</header>

<main id="app" aria-live="polite"></main>

<footer>Made of stardust, silly theories, late-night conversations, and one beginning. ✦</footer>

<script>
const pages = [
  {id:"home",label:"Home",icon:"✦"},
  {
    id:"origin",label:"The Beginning",icon:"☄",
    eyebrow:"ORBIT 01 · THE FIRST HELLO",
    title:"A stands for Amazing.",
    body:[
      "We met on Schmooze on October 11, 2025. Somehow, a swipe became a conversation that kept finding reasons to continue.",
      "You asked why I was joining a job at 21. We talked placements, the roles I wanted, and what kind of work I hoped to do. You offered a referral and started planning hiring strategies in your head.",
      "Then came <em>Mission Jobs</em>: your mission to help me land a job before November 1. I didn’t know it then, but I was meeting someone who would take my little ambitions seriously."
    ],
    quote:"“Swiping right on me has perks.”",
    tag:"THE DAY THE UNIVERSE GOT INTERESTING"
  },
  {
    id:"voice",label:"First Voice",icon:"☄",
    eyebrow:"ORBIT 02 · A VOICE IN THE DARK",
    title:"A voice, before a face-to-face.",
    body:[
      "On October 12, you asked me out before leaving for Delhi. I said no because I had classes. We ended up deciding on a Google Meet to discuss my resume instead.",
      "It was the first time I heard your voice. Calm, comfortable, not awkward at all. The kind of ordinary moment that quietly becomes a favourite memory.",
      "Then came the Instagram Blend, WhatsApp, and conversations that made one date roll into the next."
    ],
    quote:"“We are in the same team.”",
    tag:"SAME TEAM ALWAYS"
  },
  {
    id:"batman",label:"Batman Lore",icon:"🪐",
    eyebrow:"ORBIT 03 · BATMAN'S OPENING STATEMENTS",
    title:"He came with terms and conditions.",
    body:[
      "You had a no-divorce policy, two-kids opinions, and a very serious question about waking up beside you every day for the next 50 years.",
      "You asked for seven kisses a day. Not one. Not two. <em>Seven.</em> You also said you would say good morning every day and kept sending memes like it was part of your job description.",
      "You could turn flirting into a policy discussion, a SWOT analysis, or a debate about marriage logistics. Very Batman of you."
    ],
    quote:"“Aren’t you scared of waking up to me every day for the next 50 years?”",
    tag:"THE FINE PRINT WAS EXTENSIVE"
  },
  {
    id:"applebee",label:"Apple-Bee",icon:"🍎",
    eyebrow:"ORBIT 04 · THE APPLE-BEE THEORY",
    title:"A very important scientific discovery.",
    body:[
      "You once explained that the bee doesn’t have to get honey only from flowers. It can get sweetness from an apple, too.",
      "Somewhere between economics, diminishing marginal utility, and your management brain, you became the philosopher of this tiny universe."
    ],
    quote:"“That bee doesn’t need to eat honey from the flowers but also from the apple.”",
    tag:"A THEORY THAT DESERVES ITS OWN CONSTELLATION"
  },
  {
    id:"bee",label:"Bee Lore",icon:"🐝",
    eyebrow:"ORBIT 05 · THE BEE FILES",
    title:"The tiny things that became us.",
    body:[
      "You called me mommy because I told you to eat like your mom. Then came Monica Geller comparisons, panda ma, and me becoming Panda Bee because we kept talking until 2 AM.",
      "You sent tiny flowers in a sticker, kiss emojis to make me blush, and stars when I did something well became our little reward system.",
      "You were jealous of Jackson Wang, didn’t want a future cat or dog stealing my attention, and said “the cute” so often it became a whole category."
    ],
    quote:"“The cat will always land on its feet.”",
    tag:"A COMPLETELY SCIENTIFIC BEE ARCHIVE"
  },
  {id:"memories",label:"Tiny Universes",icon:"✨",
    eyebrow:"ORBIT 06 · LITTLE THINGS, BIG GRAVITY",
    title:"A museum of the very specific.",
    tag:"COLLECTED FROM OUR EARLY DAYS"},
  {
    id:"diwali",label:"The Airport Star",icon:"✈",
    eyebrow:"ORBIT 07 · THE DIWALI FLIGHT",
    title:"One star, travelling away.",
    body:[
      "You had an early-morning flight to Delhi. We made a bet about whether you’d reach the airport early or just in time. You reached early, so naturally, I decided I had won because you were a gentleman.",
      "I waited at my window, hoping to say goodbye until your plane took off. We wondered which direction it would go, even though it didn’t fly over Anna University.",
      "That was the day I sent you a voice note for the first time. You sent one back. A little piece of each of us travelled through the night."
    ],
    quote:"Some goodbyes are tiny, but the memory keeps glowing.",
    tag:"A QUIET LITTLE STAR IN OUR SKY"
  },
  {
    id:"safe",label:"Same Team",icon:"🌙",
    eyebrow:"ORBIT 08 · THE SOFTER THINGS",
    title:"A place to be yourself.",
    body:[
      "You told me I was your safe space, and that you were mine. That I could be myself even if you never became my boyfriend.",
      "You said, “Why make war when you can make love.” You told me we were on the same team. Sometimes the simplest sentences are the ones that stay with you.",
      "This chapter isn’t a prediction about the future. It’s a little place to keep what those words meant when we first heard them."
    ],
    quote:"“We are in the same team.”",
    tag:"A MEMORY, HELD GENTLY"
  },
  {
    id:"end",label:"Time Capsule",icon:"🌌",
    eyebrow:"OCTOBER 11, 2025 · TIME CAPSULE",
    title:"The day our little universe began.",
    body:[
      "This isn’t the whole story. It’s the first constellation: a Schmooze hello, an Amazing question, Mission Jobs, a few impossible theories, and two people discovering how easy it was to keep talking.",
      "Somewhere in the vastness of everything, this day happened. And I wanted to give it a little sky of its own."
    ],
    quote:"To the beginning — exactly as it was.",
    tag:"END OF THIS LITTLE TOUR · NOT THE MEMORY"
  }
];

let current = "home";
const app = document.getElementById("app");

function button(text, action, cls="btn") {
  return `<button class="${cls}" data-action="${action}">${text}</button>`;
}

function pageNumber() {
  return pages.findIndex(p => p.id === current);
}

function navRow() {
  const i = pageNumber();
  const prev = i > 0 ? pages[i-1] : null;
  const next = i < pages.length-1 ? pages[i+1] : null;
  return `
    <div class="nav-row">
      ${prev ? button("← Back","back","btn ghost") : button("← Galaxy","map","btn ghost")}
      <span class="page-count">${i+1} / ${pages.length}</span>
      ${next ? button("Next chapter →","next","btn primary") : button("Galaxy map ✦","map","btn primary")}
    </div>`;
}

function heading(p) {
  return `
    <div class="chapter-head">
      <div class="chapter-icon">${p.icon}</div>
      <div>
        <div class="eyebrow">${p.eyebrow}</div>
        <h2>${p.title}</h2>
      </div>
    </div>`;
}

function renderHome() {
  app.innerHTML = `
    <section class="scene hero">
      <div class="cosmos" aria-hidden="true">
        <div class="orbit"></div><div class="orbit two"></div>
        <div class="core"></div><div class="moon"></div>
      </div>
      <div class="eyebrow">A TIME CAPSULE · 11 OCTOBER 2025</div>
      <h1>Somewhere in this universe,<br><em>Batman met Bee.</em></h1>
      <p>One hello on Schmooze. A hundred little things that followed. This is a tiny galaxy made just for the beginning of our story.</p>
      <div class="actions">${button("Enter our galaxy ✦","map","btn primary")}</div>
      <p style="font-size:.78rem;color:#928caf;margin-top:18px">Tap a planet to open a memory. Take your time.</p>
    </section>`;
}

function renderMap() {
  app.innerHTML = `
    <section class="scene panel">
      <div class="eyebrow">CHOOSE YOUR DESTINATION</div>
      <h2>Our little galaxy.</h2>
      <p>Every planet holds a chapter. Click one to travel there.</p>
      <div class="planet-map">
        ${pages.filter(p=>p.id!=="home").map((p,i)=>`
          <button class="planet-link" data-go="${p.id}">
            <span class="planet p${i%6+1}"></span>
            <span class="planet-name">${p.label}</span>
            <span class="planet-caption">${String(i+1).padStart(2,"0")} · OPEN MEMORY</span>
          </button>`).join("")}
      </div>
      ${button("Start from the beginning →","go-origin","btn primary")}
    </section>`;
}

function renderStory(p) {
  app.innerHTML = `
    <section class="scene">
      <div class="progress"><span style="width:${(pageNumber()+1)/pages.length*100}%"></span></div>
      <div class="panel">
        ${heading(p)}
        <div class="split">
          <div>${p.body.map(text=>`<p>${text}</p>`).join("")}</div>
          <div>
            <div class="quote">${p.quote}</div>
            <span class="stamp">${p.tag}</span>
            <div class="stars-line">✦ · ˚ ✧ ˚ · ✦</div>
          </div>
        </div>
        ${navRow()}
      </div>
    </section>`;
}

function renderQuiz(p) {
  app.innerHTML = `
    <section class="scene">
      <div class="progress"><span style="width:${(pageNumber()+1)/pages.length*100}%"></span></div>
      <div class="panel">
        ${heading(p)}
        ${p.body.map(text=>`<p>${text}</p>`).join("")}
        <div class="quote">${p.quote}</div>
        <h3>THE INTERGALACTIC BEE INSTITUTE</h3>
        <p>What was Batman trying to say with the Apple-Bee theory?</p>
        <div class="answer-list">
          <button class="answer" data-answer="wrong">Bees should stop visiting flowers.</button>
          <button class="answer" data-answer="correct">Sweetness can come from more than one place.</button>
          <button class="answer" data-answer="wrong">Apple is scientifically better than honey.</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <span class="stamp">${p.tag}</span>
        ${navRow()}
      </div>
    </section>`;
}

function renderMemories(p) {
  const items = [
    ["“Avan kedakuran.”","When I asked whether your manager was okay with you spending work hours talking to me."],
    ["Jackson Wang","Celebrity-crush jealousy was apparently a serious matter."],
    ["The pet policy","You didn’t want a cat or dog stealing all my future attention."],
    ["Diminishing marginal utility","Even flirting could turn into an economics lesson."],
    ["The Green Lantern reference","A story about asking someone to marry you after only two days because you already knew, but didn’t want to startle her."],
    ["The perfect crime","“If I stole your heart & you stole mine, wouldn’t that be a perfect crime?”"],
    ["The tiger thought","“Handling a tiger is easier than thinking about handling a tiger.” And then you became Buddha."],
    ["The Delhi house","You showed me your Delhi house and asked if it was normal to be jealous of your dad."]
  ];

  app.innerHTML = `
    <section class="scene">
      <div class="progress"><span style="width:${(pageNumber()+1)/pages.length*100}%"></span></div>
      <div class="panel">
        ${heading(p)}
        <p>Tap a memory card. These are the tiny details that make this galaxy ours.</p>
        <div class="memory-grid">
          ${items.map((m,i)=>`
            <button class="memory" data-memory="${i}">
              <b>${m[0]}</b><span>${m[1]}</span>
            </button>`).join("")}
        </div>
        <div class="feedback" id="feedback" style="margin-top:18px">Every card is a small orbit of its own. ✦</div>
        ${navRow()}
      </div>
    </section>`;
}

function renderAirport(p) {
  app.innerHTML = `
    <section class="scene">
      <div class="progress"><span style="width:${(pageNumber()+1)/pages.length*100}%"></span></div>
      <div class="panel" style="text-align:center">
        ${heading(p)}
        <div class="airport-sky"></div>
        ${p.body.map(text=>`<p>${text}</p>`).join("")}
        <div class="quote">${p.quote}</div>
        <span class="stamp">${p.tag}</span>
        ${navRow()}
      </div>
    </section>`;
}

function renderEnd(p) {
  app.innerHTML = `
    <section class="scene">
      <div class="panel" style="text-align:center">
        <div class="cosmos" aria-hidden="true">
          <div class="orbit"></div><div class="orbit two"></div>
          <div class="core"></div><div class="moon"></div>
        </div>
        <div class="eyebrow">${p.eyebrow}</div>
        <h2>${p.title}</h2>
        ${p.body.map(text=>`<p style="max-width:660px;margin:0 auto 15px">${text}</p>`).join("")}
        <div class="final-orbit"><span>🦇</span><i></i><span>🐝</span></div>
        <div class="quote">${p.quote}</div>
        <span class="stamp">${p.tag}</span>
        <div class="actions">
          ${button("Back to the galaxy ✦","map","btn primary")}
          ${button("Read from the start","restart","btn")}
        </div>
      </div>
    </section>`;
}

function render() {
  if (current==="home") return renderHome();
  if (current==="map") return renderMap();

  const p = pages.find(p=>p.id===current);
  if (!p) return renderHome();

  if (current==="applebee") renderQuiz(p);
  else if (current==="memories") renderMemories(p);
  else if (current==="diwali") renderAirport(p);
  else if (current==="end") renderEnd(p);
  else renderStory(p);

  window.scrollTo({top:0,behavior:"smooth"});
}

function go(id) {
  current = id;
  render();
}

app.addEventListener("click", event => {
  const target = event.target.closest("button");
  if (!target) return;

  if (target.dataset.go) {
    go(target.dataset.go);
    return;
  }

  const action = target.dataset.action;
  if (action==="map") go("map");
  if (action==="go-origin") go("origin");
  if (action==="restart") go("home");

  if (action==="back") {
    const i = pageNumber();
    go(i>0 ? pages[i-1].id : "map");
  }

  if (action==="next") {
    const i = pageNumber();
    go(i<pages.length-1 ? pages[i+1].id : "end");
  }

  if (target.dataset.answer) {
    const answers = app.querySelectorAll("[data-answer]");
    const feedback = app.querySelector("#feedback");

    if (target.dataset.answer==="correct") {
      answers.forEach(b => {
        b.disabled = true;
        if (b.dataset.answer==="correct") b.classList.add("correct");
      });
      feedback.textContent = "Correct! Bee can find sweetness in more than one place. 🍎🐝";
    } else {
      target.classList.add("wrong");
      target.disabled = true;
      feedback.textContent = "Not quite! Think about sweetness coming from more than one place.";
    }
  }

  if (target.dataset.memory!==undefined) {
    const messages = [
      "A tiny work-hours rebellion in the name of talking to Bee.",
      "Jackson Wang was not allowed to have an easy time in this universe.",
      "Future pets would have to negotiate for attention.",
      "Romance, but make it an economics lecture.",
      "The Green Lantern story: he fell for her immediately, waited so he wouldn’t startle her, and asked after two days.",
      "A meme that made stealing a heart sound like a flawless heist.",
      "The tiger line that made the overthinker sound like a monk.",
      "A house photo, a little jealousy, and an unexpectedly sweet question."
    ];
    app.querySelector("#feedback").textContent = messages[Number(target.dataset.memory)];
  }
});

render();
</script>
</body>
</html>
